[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "debugging-framework"
version = "0.5.0"
description = "Automated C/C++ fault-localization and validated patch repair driven by Codex CLI"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
debugging-framework = "debugging_framework.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.package-data]
src = ["schemas/*.json"]

[tool.setuptools]
packages = [
  "debugging_framework",
  "src",
  "src.core",
  "src.loaders",
  "src.schemas",
  "src.utils",
  "src.validation",
  "src.environments",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
